<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>Wikipedia 3d graph</title>
        <link rel="stylesheet" href="style.css">
    </head>
    <body>
        <div id="controls">
            <strong>WIKIPEDIA 3D GRAPH</strong>
            <input id="search" type="search" placeholder="Article title">
            <button id="search-button">Search</button>
            <button id="bfs-button" disabled>Run BFS</button>
            <button id="reset-all"> RESET!!! </button>
            <button id="back-button" disabled> Back</button>
            <button id="forward-button" disabled>Forward </button>
        </div>

        <div id="info">CLICK A NODE TO INSPECT IT.</div>
        <div id="graph"></div>

        <script src="https://cdn.jsdelivr.net/npm/3d-force-graph@1.80.0/dist/3d-force-graph.min.js"></script>
        <script src="graph_module.js"></script>
        <script src="app.js"></script>
    </body>
</html>
